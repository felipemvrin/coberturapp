<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CoberturApp - Visualizador de cobertura de antenas móviles en Chile">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CoberturApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- This script installs service_worker.js to provide PWA functionality to
       application. For more information, see:
       https://developers.google.com/web/fundamentals/primers/service-workers -->
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for registration to complete before dropping the splash
        // screen. Otherwise there will be a race condition between removing
        // the splash screen and navigating to a new page that itself shows
        // the splash screen. Wait for the first update check to complete.
        //
        // If the load failed, just proceed to load the page.
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        fetch(serviceWorkerUrl)
          .then(function (response) {
            // Okay, the service worker is here. Use it.
            loadMainDartJs();
          })
          .catch(function () {
            // Service worker won't load. Just proceed as if it doesn't exist.
            loadMainDartJs();
          });
      });
    } else {
      // Service workers not supported. Just proceed.
      loadMainDartJs();
    }
  </script>
</head>
<body>
  <script>
    window.flutterPlattformChannelReady = function() {};
  </script>
</body>
</html>
